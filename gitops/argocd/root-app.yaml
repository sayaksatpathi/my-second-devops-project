# App-of-apps: Argo CD watches this; it fans out to the child Applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opsforge-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sayaksatpathi/my-second-devops-project
    targetRevision: main
    path: gitops/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
