global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/rules/recording.yml
  - /etc/prometheus/rules/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: user-api
    static_configs: [{ targets: ["user-api:8000"] }]
  - job_name: order-api
    static_configs: [{ targets: ["order-api:8001"] }]
  - job_name: worker
    static_configs: [{ targets: ["worker:9100"] }]
