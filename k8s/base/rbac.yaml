# Least-privilege: the app SA can only read its own config/secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: opsforge-app, namespace: opsforge }
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: opsforge-app, namespace: opsforge }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: opsforge-app }
subjects:
  - { kind: ServiceAccount, name: opsforge, namespace: opsforge }
