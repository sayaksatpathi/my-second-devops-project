name: opsforge

# Complete local developer environment (zero AWS cost):
#   apps (user-api, order-api, worker) + Postgres + Redis + Kafka
#   + observability (Prometheus, Grafana, Alertmanager, Loki, OTel, Jaeger)
#
#   docker compose up --build
#   Grafana http://localhost:3000 (admin/admin) · Prometheus :9090
#   Alertmanager :9093 · Jaeger :16686

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opsforge
      POSTGRES_PASSWORD: opsforge
      POSTGRES_DB: opsforge
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  user-api:
    build: ./app/user-api
    environment:
      DATABASE_URL: postgresql+psycopg2://opsforge:opsforge@postgres:5432/opsforge
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  order-api:
    build: ./app/order-api
    environment:
      DATABASE_URL: postgresql+psycopg2://opsforge:opsforge@postgres:5432/opsforge
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["8001:8001"]
    depends_on:
      postgres: {condition: service_healthy}

  worker:
    build: ./app/worker
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["9100:9100"]
    depends_on: [kafka]

  prometheus:
    image: prom/prometheus:v2.53.2
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    depends_on: [alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports: ["9093:9093"]
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/loki.yml
    ports: ["3100:3100"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/collector.yaml"]
    ports: ["4318:4318"]
    volumes:
      - ./observability/otel/collector.yaml:/etc/otel/collector.yaml:ro
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports: ["16686:16686"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
