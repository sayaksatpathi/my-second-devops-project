{{- range $name, $app := .Values.apps }}
{{- if $app.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: opsforge-{{ $name }}
  labels:
    app.kubernetes.io/name: opsforge-{{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opsforge-{{ $name }}
  ports:
    - name: http
      port: {{ $app.service.port }}
      targetPort: {{ $app.service.targetPort }}
---
{{- end }}
{{- end }}
