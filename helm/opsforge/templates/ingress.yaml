{{- if .Values.ingress.enabled }}
{{- $svcName := .Values.ingress.serviceName | default "user-api" }}
{{- $app := index .Values.apps $svcName }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opsforge.name" . }}
  labels:
    {{- include "opsforge.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opsforge-{{ $svcName }}
                port:
                  number: {{ $app.service.port }}
{{- end }}
