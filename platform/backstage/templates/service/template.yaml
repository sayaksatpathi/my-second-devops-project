# Golden-path software template: scaffolds a new OpsForge service with a
# Dockerfile, CI, Helm values, and catalog registration — the self-service IDP flow.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: opsforge-service
  title: New OpsForge Service
  description: Create a FastAPI service wired for CI, Helm, GitOps, and monitoring.
spec:
  owner: platform-team
  type: service
  parameters:
    - title: Service details
      required: [name, owner]
      properties:
        name: { title: Name, type: string, pattern: "^[a-z][a-z0-9-]+$" }
        owner: { title: Owner, type: string }
  steps:
    - id: fetch
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values: { name: "${{ parameters.name }}", owner: "${{ parameters.owner }}" }
    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: "github.com?owner=sayaksatpathi&repo=${{ parameters.name }}"
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: "${{ steps.publish.output.repoContentsUrl }}"
        catalogInfoPath: "/catalog-info.yaml"
  output:
    links:
      - title: Repository
        url: "${{ steps.publish.output.remoteUrl }}"
