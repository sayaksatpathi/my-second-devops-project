name: OpsForge CI/CD

# validate (IaC/k8s/helm) + lint/test + security scan ->
# build -> Trivy -> SBOM -> Cosign sign -> push to GHCR (main only).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/opsforge-user-api

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        working-directory: app/user-api
        run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        working-directory: app/user-api
        run: ruff check app tests
      - name: Pytest
        working-directory: app/user-api
        run: pytest -q

  validate:
    name: Validate IaC / K8s / Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive
      - uses: azure/setup-helm@v4
      - name: helm lint + template
        run: |
          helm lint helm/opsforge
          helm template opsforge helm/opsforge -f helm/opsforge/values-prod.yaml > /tmp/rendered.yaml
      - name: kubeconform (manifests)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 \
            k8s/base/namespaces.yaml k8s/base/networkpolicy.yaml k8s/base/rbac.yaml /tmp/rendered.yaml
      - name: checkov (IaC scan, report-only)
        run: pip install checkov && checkov -d terraform --soft-fail --compact

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bandit (SAST) + pip-audit (deps)
        continue-on-error: true
        run: |
          pip install bandit pip-audit
          bandit -r app/ || true
          pip-audit -r app/user-api/requirements.txt || true

  build:
    name: Build, scan, sign, publish
    needs: [test, validate, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # Cosign keyless signing
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" app/user-api
      - name: Trivy scan (report)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image --severity HIGH,CRITICAL --exit-code 0 \
            "$IMAGE:${{ github.sha }}"
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.spdx.json }
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign sign --yes "$IMAGE:${{ github.sha }}"
