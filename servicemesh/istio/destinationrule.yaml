apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: { name: user-api, namespace: opsforge }
spec:
  host: user-api
  trafficPolicy:
    tls: { mode: ISTIO_MUTUAL }   # mTLS between sidecars
  subsets:
    - { name: v1, labels: { version: v1 } }
    - { name: v2, labels: { version: v2 } }
