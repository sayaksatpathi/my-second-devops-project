# Canary: 90% v1 / 10% v2 with a retry + timeout policy.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: { name: user-api, namespace: opsforge }
spec:
  hosts: ["user-api"]
  http:
    - route:
        - destination: { host: user-api, subset: v1 }
          weight: 90
        - destination: { host: user-api, subset: v2 }
          weight: 10
      retries: { attempts: 3, perTryTimeout: 2s, retryOn: "5xx,connect-failure" }
      timeout: 5s
